trigger:
- main

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: Build
    pool:
      vmImage: windows-latest
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 9'
      inputs:
        packageType: sdk
        version: '9.x'

    - script: dotnet restore
      displayName: 'Restore dependencies'

    - script: dotnet build --no-restore --configuration Release
      displayName: 'Build'

    - script: dotnet publish --no-build --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish'

    - task: ArchiveFiles@2
      displayName: 'Zip published output'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        ArtifactName: drop

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy Azure App Service'
    pool:
      vmImage: windows-latest
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to jakobknudsen'
            inputs:
              azureSubscription: 'JAKK Visual Studio Enterprise (a97af571-6bca-42ea-9fc6-07e5e9231413)'
              appType: webApplication
              appName: 'jakobknudsen'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
